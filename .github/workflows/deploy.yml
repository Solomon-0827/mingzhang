name: Verify and deploy
on:
  pull_request:
    branches: [feat/first-release]
  push:
    branches: [feat/first-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check backend scripts tests deploy/publish-desktop.py
      - run: uv run pytest -q
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix desktop ci --ignore-scripts
      - run: npm --prefix desktop test
      - run: node --check desktop/main.cjs && node --check desktop/preload.cjs && node --check desktop/setup.js && node --check desktop/updater.cjs && node --check desktop/publish.mjs
      - run: bash -n deploy/upgrade.sh
      - run: docker run --rm -v "$PWD:/source:ro" python:3.12-slim bash /source/tests/deploy-smoke.sh
      - name: Package application only
        if: github.event_name != 'pull_request'
        run: tar --exclude=__pycache__ --exclude='*.pyc' -czf mingzhang.tar.gz backend scripts deploy web/dist
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: mingzhang-${{ github.sha }}
          path: mingzhang.tar.gz
          retention-days: 1
  desktop-changes:
    needs: [verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/first-release'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          changed=false
          if [[ $EVENT == workflow_dispatch || ! $BEFORE =~ ^[0-9a-f]{40}$ || $BEFORE == 0000000000000000000000000000000000000000 ]]; then
            changed=true
          elif ! git diff --quiet "$BEFORE" "${{ github.sha }}" -- desktop/ deploy/publish-desktop.py .github/workflows/deploy.yml; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  package-mac:
    needs: [verify, desktop-changes]
    if: needs.desktop-changes.outputs.changed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run package -- darwin
      - uses: actions/upload-artifact@v4
        with:
          name: mingzhang-mac-${{ github.sha }}
          path: desktop/out/downloads/mingzhang-mac-arm64.zip*
          retention-days: 1
  package-windows:
    needs: [verify, desktop-changes]
    if: needs.desktop-changes.outputs.changed == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run package -- win32
      - uses: actions/upload-artifact@v4
        with:
          name: mingzhang-windows-${{ github.sha }}
          path: desktop/out/downloads/mingzhang-windows11-x64.zip*
          retention-days: 1
  deploy:
    needs: [verify, desktop-changes, package-mac, package-windows]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/first-release' && needs.verify.result == 'success' && (needs.desktop-changes.outputs.changed != 'true' || (needs.package-mac.result == 'success' && needs.package-windows.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    environment: production
    concurrency:
      group: mingzhang-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mingzhang-${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: needs.desktop-changes.outputs.changed == 'true'
        with:
          pattern: mingzhang-*-${{ github.sha }}
          path: desktop-artifacts
          merge-multiple: true
      - name: Reject stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          latest=$(gh api "repos/$REPOSITORY/git/ref/heads/feat/first-release" --jq .object.sha)
          test "$latest" = "$REVISION" || { echo 'A newer commit exists; refusing stale deployment'; exit 1; }
      - name: Install SSH identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/*
      - name: Upload and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes mingzhang.tar.gz "$target:mingzhang-$REVISION.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "set -eu; mkdir -p releases/$REVISION; tar -xzf mingzhang-$REVISION.tar.gz -C releases/$REVISION; cd releases/$REVISION; sudo -n bash deploy/upgrade.sh $REVISION; cd; rm -f -- mingzhang-$REVISION.tar.gz; rm -rf -- releases/$REVISION"
      - name: Publish desktop clients
        if: needs.desktop-changes.outputs.changed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REVISION: ${{ github.sha }}
          DESKTOP_VERSION: ${{ needs.desktop-changes.outputs.version }}
        run: |
          set -euo pipefail
          [[ $DESKTOP_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          target="$DEPLOY_USER@$DEPLOY_HOST"
          stage="desktop-$REVISION"
          cleanup() { ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "rm -rf -- '$stage'" || true; }
          trap cleanup EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '$stage'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes desktop-artifacts/* "$target:$stage/"
          for name in mingzhang-mac-arm64.zip mingzhang-windows11-x64.zip; do
            digest=$(awk -v file="$name" '$2 == file {print $1}' "desktop-artifacts/$name.sha256")
            [[ $digest =~ ^[0-9a-f]{64}$ ]]
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "sudo -n python3 /opt/mingzhang/app/deploy/publish-desktop.py '$stage/$name' '$name' '$digest' '$DESKTOP_VERSION'"
          done
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519
      - name: Remove temporary workflow artifacts
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r id; do gh api --method DELETE "repos/$REPOSITORY/actions/artifacts/$id"; done
