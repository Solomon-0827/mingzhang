[project]
name = "personal-ledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0.2,<3",
]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
